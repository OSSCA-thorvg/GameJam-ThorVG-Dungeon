<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThorVG Dungeon</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #14151a;
      }
      canvas {
        touch-action: none;
        display: block;
      }
      footer {
        position: fixed;
        right: 8px;
        bottom: 6px;
        font: 11px sans-serif;
        color: #7a7d86;
      }
      footer a {
        color: inherit;
      }
      /* Sits on the hero health bar drawn in render.ts. */
      #hp {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 200px;
        font: bold 12px/16px sans-serif;
        text-align: center;
        color: #fff;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      /* Below the hero health bar. */
      #stats,
      #status {
        position: fixed;
        left: 12px;
        font: 12px sans-serif;
        color: #c8cad2;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #stats {
        top: 34px;
      }
      #status {
        top: 52px;
        display: flex;
        gap: 8px;
        /* So that hovering an icon shows its name. */
        pointer-events: auto;
      }
      .status-effect {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0;
        font: bold 14px sans-serif;
        color: inherit;
        text-shadow: 0 1px 2px #000;
        background: none;
        border: none;
        cursor: pointer;
      }
      .status-effect svg {
        width: 28px;
        height: 28px;
        padding: 4px;
        border-radius: 50%;
        background: rgb(20 21 26 / 80%);
      }
      #status-tooltip {
        position: fixed;
        max-width: 220px;
        padding: 8px 10px;
        font: 13px/1.4 sans-serif;
        color: #e8e8ec;
        background: #1f2027;
        border: 1px solid #4a4d58;
        border-radius: 6px;
        pointer-events: none;
      }
      #status-tooltip p {
        margin: 4px 0 0;
      }
      .status-effect .line {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .status-effect .fill {
        fill: currentColor;
      }
      /* Above the wait button. */
      #log {
        position: fixed;
        left: 12px;
        bottom: 84px;
        width: min(360px, calc(100vw - 24px));
        font: 15px/1.4 sans-serif;
        color: #e8e8ec;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #floor {
        position: fixed;
        top: 10px;
        right: 12px;
        font: 16px sans-serif;
        color: #c8cad2;
      }
      #wait {
        left: 12px;
      }
      #inventory-button {
        right: 12px;
      }
      #wait,
      #inventory-button {
        position: fixed;
        bottom: 28px;
        min-width: 72px;
        min-height: 44px;
        font: 16px sans-serif;
        color: #e8e8ec;
        background: #2c2e36;
        border: 1px solid #4a4d58;
        border-radius: 6px;
        cursor: pointer;
        touch-action: manipulation;
      }
      #wait-clock {
        position: absolute;
        inset: 0;
        width: 30px;
        height: 30px;
        margin: auto;
        opacity: 0;
        pointer-events: none;
        fill: none;
        stroke: #e8e8ec;
        stroke-width: 1.6;
        stroke-linecap: round;
      }
      #inventory {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(0 0 0 / 50%);
      }
      #inventory[hidden] {
        display: none;
      }
      #inventory-panel {
        width: min(340px, calc(100vw - 24px));
        box-sizing: border-box;
        padding: 12px;
        font: 14px sans-serif;
        color: #e8e8ec;
        background: #1f2027;
        border: 1px solid #4a4d58;
        border-radius: 8px;
      }
      #inventory-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 16px;
      }
      #inventory-close {
        width: 36px;
        height: 36px;
        font-size: 20px;
        color: inherit;
        background: none;
        border: none;
        cursor: pointer;
      }
      #equipment-slots {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #3a3c46;
      }
      .inventory-slot.empty-equipment svg {
        opacity: 0.25;
      }
      #inventory-slots {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .inventory-slot {
        position: relative;
        aspect-ratio: 1;
        padding: 6px;
        background: #2c2e36;
        border: 1px solid #3a3c46;
        border-radius: 6px;
        cursor: pointer;
        touch-action: manipulation;
      }
      .inventory-slot:disabled {
        background: #25262d;
        cursor: default;
      }
      .inventory-slot.selected {
        border-color: #f5cd46;
      }
      .inventory-slot svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .inventory-slot span {
        position: absolute;
        right: 4px;
        bottom: 2px;
        font: bold 12px sans-serif;
        color: #fff;
        text-shadow: 0 1px 2px #000;
      }
      #inventory-details {
        min-height: 92px;
        margin-top: 12px;
      }
      #inventory-details p {
        margin: 6px 0 10px;
        color: #c8cad2;
      }
      #inventory-details button {
        min-width: 72px;
        min-height: 40px;
        font: 14px sans-serif;
        color: #e8e8ec;
        background: #3a3d48;
        border: 1px solid #5a5d68;
        border-radius: 6px;
        cursor: pointer;
      }
      #inventory-details button:disabled {
        color: #7a7d86;
        cursor: default;
      }
      #inventory-details p.item-stat {
        color: #9a9ca6;
      }
      #inventory-details .inventory-actions {
        display: flex;
        gap: 8px;
      }
      #target-prompt {
        position: fixed;
        top: 48px;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 6px 6px 14px;
        font: 15px sans-serif;
        color: #e8e8ec;
        background: #1f2027;
        border: 1px solid #5a8fd0;
        border-radius: 6px;
        transform: translateX(-50%);
      }
      #target-prompt[hidden] {
        display: none;
      }
      #target-prompt button {
        min-height: 36px;
        padding: 0 12px;
        font: 14px sans-serif;
        color: #e8e8ec;
        background: #3a3d48;
        border: 1px solid #5a5d68;
        border-radius: 6px;
        cursor: pointer;
      }
      #game-over {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgb(0 0 0 / 60%);
        font: 28px sans-serif;
        color: #e8e8ec;
      }
      #game-over[hidden] {
        display: none;
      }
      #run-stats {
        margin: 0;
        padding: 0;
        list-style: none;
        font: 16px/1.6 sans-serif;
        text-align: center;
        color: #c8cad2;
      }
      #game-over button {
        padding: 8px 20px;
        font: 16px sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hp"></div>
    <div id="stats"></div>
    <div id="status"></div>
    <div id="status-tooltip" hidden></div>
    <div id="log" aria-live="polite"></div>
    <div id="floor"></div>
    <button id="wait" hidden>
      <span id="wait-label">Wait</span>
      <svg id="wait-clock" viewBox="-12 -12 24 24" aria-hidden="true">
        <circle r="10.5" />
        <line id="wait-minute-hand" y2="-8" />
        <line id="wait-hour-hand" y2="-5" />
      </svg>
    </button>
    <button id="inventory-button" hidden>Bag</button>
    <div id="inventory" hidden>
      <div id="inventory-panel" role="dialog" aria-label="Bag">
        <div id="inventory-header">
          Bag
          <button id="inventory-close" aria-label="Close">×</button>
        </div>
        <div id="equipment-slots"></div>
        <div id="inventory-slots"></div>
        <div id="inventory-details"></div>
      </div>
    </div>
    <div id="target-prompt" hidden>
      <span id="target-prompt-text"></span>
      <button id="target-cancel">Cancel</button>
    </div>
    <div id="game-over" hidden>
      You died
      <ul id="run-stats"></ul>
      <button id="restart">Try again</button>
    </div>
    <footer hidden>
      <a href="https://game-icons.net/1x1/cathelineau/swordman.html">Swordman</a> by Cathelineau,
      modified, <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
