<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThorVG Dungeon</title>
    <style>
      @font-face {
        font-family: 'Galmuri9';
        src: url('./assets/fonts/Galmuri9.woff2') format('woff2');
        font-display: swap;
      }
      @font-face {
        font-family: 'Galmuri11';
        src: url('./assets/fonts/Galmuri11.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Galmuri11';
        src: url('./assets/fonts/Galmuri11-Bold.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      body,
      button,
      input,
      select {
        font-family: 'Galmuri11', sans-serif;
      }
      /* A game has nothing to select, and dragging the camera or pressing Ctrl+A would paint the text blue. */
      body {
        -webkit-user-select: none;
        user-select: none;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #14151a;
      }
      canvas {
        touch-action: none;
        display: block;
      }
      /* The UI scale setting enlarges everything but the map, as display scaling enlarges a whole
         screen. A zoomed element also zooms viewport units, so widths from them divide it out. */
      body > :not(canvas) {
        zoom: var(--ui-scale, 1);
      }
      /* Below the hero health bar and the line of numbers that ThorVG draws under it. */
      #status {
        position: fixed;
        left: 12px;
        font: 22px 'Galmuri11', sans-serif;
        color: #c8cad2;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      /* 1.5 lines of text below the stats. */
      #status {
        top: 88px;
        display: flex;
        gap: 8px;
        /* So that hovering an icon shows its name. */
        pointer-events: auto;
      }
      .status-effect {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0;
        font: bold 22px 'Galmuri11', sans-serif;
        color: inherit;
        text-shadow: 0 1px 2px #000;
        background: none;
        border: none;
        cursor: pointer;
      }
      /* Twice as tall as the number beside it. */
      /* The icon is 11 art pixels on a 15 pixel badge, 2 screen pixels to an art pixel. */
      .status-effect svg {
        width: 30px;
        height: 30px;
        padding: 4px;
        box-sizing: border-box;
        background: var(--badge) center / 100% 100% no-repeat;
        image-rendering: pixelated;
      }
      #status-tooltip {
        position: fixed;
        max-width: 220px;
        padding: 8px 10px;
        font: 18px/1.4 'Galmuri9', sans-serif;
        color: #e8e8ec;
        border: 8px solid transparent;
        border-image: var(--window) 4 fill / 8px;
        pointer-events: none;
      }
      #status-tooltip p {
        margin: 4px 0 0;
      }
      /* Above the wait button. */
      #log {
        position: fixed;
        left: 12px;
        bottom: 100px;
        width: min(640px, calc(100vw / var(--ui-scale, 1) - 24px));
        font: 22px/1.4 'Galmuri11', sans-serif;
        color: #e8e8ec;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #top-right {
        position: fixed;
        top: 6px;
        right: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #floor {
        font: 22px 'Galmuri11', sans-serif;
        color: #c8cad2;
      }
      #bottom-left {
        position: fixed;
        left: 12px;
        bottom: 28px;
        display: flex;
        gap: 8px;
      }
      #inventory-button {
        position: fixed;
        right: 12px;
        bottom: 28px;
      }
      #inventory,
      #log-window,
      #settings,
      #dialog {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(0 0 0 / 50%);
      }
      #inventory[hidden],
      #log-window[hidden],
      #settings[hidden],
      #dialog[hidden] {
        display: none;
      }
      #inventory-panel,
      #log-panel,
      #settings-panel,
      #dialog-panel {
        width: min(340px, calc(100vw / var(--ui-scale, 1) - 24px));
        box-sizing: border-box;
        padding: 12px;
        font: 22px 'Galmuri11', sans-serif;
        color: #e8e8ec;
        border: 8px solid transparent;
        border-image: var(--window) 4 fill / 8px;
      }
      #inventory-header,
      #log-header,
      #settings-header,
      #dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        padding-bottom: 6px;
        font-size: 22px;
        border-bottom: 2px solid #14151a;
      }
      #log-panel {
        width: min(720px, calc(100vw / var(--ui-scale, 1) - 24px));
      }
      #log-lines {
        height: 60vh;
        overflow-y: scroll;
        font-size: 22px;
        line-height: 1.5;
      }
      #log-lines div {
        padding: 2px 0;
      }
      /* Each message starts with a square in its own color, 3 by 3 art pixels, so that the start
         of a message that wraps onto more lines can be told apart. */
      #log div,
      #log-lines div {
        position: relative;
        padding-left: 16px;
      }
      #log div::before,
      #log-lines div::before {
        content: '';
        position: absolute;
        left: 2px;
        top: calc(0.5lh - 3px);
        width: 6px;
        height: 6px;
        background: currentColor;
      }
      #log div::before {
        box-shadow: 0 1px 2px #000;
      }
      #log-lines div::before {
        top: calc(2px + 0.5lh - 3px);
      }
      /* The scroll bar of the log is a groove like the track of a slider, with a button for its
         thumb. A scroll bar takes no border image, so the thumb is drawn with a border and inset
         shadows in the colors of a button in uiArt.ts. Firefox has no way to style the parts, so
         it gets the colors only. */
      #log-lines::-webkit-scrollbar {
        width: 16px;
      }
      #log-lines::-webkit-scrollbar-track {
        border: 2px solid #15161c;
        background: #23242c;
      }
      #log-lines::-webkit-scrollbar-thumb {
        border: 2px solid #15161c;
        background: #2c2e36;
        box-shadow:
          inset 2px 2px 0 #5a5e6c,
          inset -2px -2px 0 #1c1d24;
      }
      #log-lines::-webkit-scrollbar-thumb:hover {
        background: #3a3e4a;
        box-shadow:
          inset 2px 2px 0 #7a7e8e,
          inset -2px -2px 0 #1c1d24;
      }
      #log-lines::-webkit-scrollbar-thumb:active {
        background: #24262e;
        box-shadow:
          inset 2px 2px 0 #1c1d24,
          inset -2px -2px 0 #5a5e6c;
      }
      @supports (-moz-appearance: none) {
        #log-lines {
          scrollbar-color: #6a6e7c #23242c;
        }
      }
      #settings-panel label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 40px;
      }
      #settings-panel select {
        min-height: 36px;
        padding: 0 30px 0 10px;
        font: 22px 'Galmuri11', sans-serif;
        color: #e8e8ec;
        appearance: none;
        border: 4px solid transparent;
        border-image: var(--button) 2 / 4px;
        background: #2c2e36 var(--select-arrow) no-repeat right 8px center / 14px 8px;
        image-rendering: pixelated;
      }
      /* The switch is 26 by 14 art pixels, with its knob at the right while muted. */
      #mute {
        width: 52px;
        height: 28px;
        padding: 0;
        border: none;
        background: var(--switch-off) center / 100% 100% no-repeat;
        image-rendering: pixelated;
        cursor: pointer;
      }
      #mute[aria-pressed='true'] {
        background-image: var(--switch-on);
      }
      /* A slider fills its track in the blue of the experience bar up to its value, which
         settingsPanel.ts sets as --fill. */
      #settings-panel input[type='range'] {
        width: 120px;
        height: 24px;
        margin: 0;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }
      #settings-panel input[type='range']::-webkit-slider-runnable-track {
        box-sizing: border-box;
        height: 8px;
        border: 2px solid #15161c;
        background:
          linear-gradient(to right, transparent var(--fill, 100%), #23242c var(--fill, 100%)),
          linear-gradient(#9ab4f4 50%, #5a78d0 50%);
      }
      #settings-panel input[type='range']::-moz-range-track {
        box-sizing: border-box;
        height: 8px;
        border: 2px solid #15161c;
        background:
          linear-gradient(to right, transparent var(--fill, 100%), #23242c var(--fill, 100%)),
          linear-gradient(#9ab4f4 50%, #5a78d0 50%);
      }
      #settings-panel input[type='range']::-webkit-slider-thumb {
        width: 14px;
        height: 24px;
        margin-top: -10px;
        appearance: none;
        border: none;
        background: var(--slider-knob) center / 100% 100% no-repeat;
        image-rendering: pixelated;
      }
      #settings-panel input[type='range']::-moz-range-thumb {
        width: 14px;
        height: 24px;
        border: none;
        border-radius: 0;
        background: var(--slider-knob) center / 100% 100% no-repeat;
        image-rendering: pixelated;
      }
      #dialog-panel p {
        margin: 0 0 10px;
        line-height: 1.5;
        color: #c8cad2;
      }
      /* Wide enough that a line of the controls guide holds about 20 Korean letters beside its
         icon. A narrow screen still gets the full width less the margins. */
      #dialog-panel.wide {
        width: min(480px, calc(100vw / var(--ui-scale, 1) - 24px));
      }
      #dialog-panel p[hidden],
      #dialog-entries[hidden] {
        display: none;
      }
      #dialog-entries {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 18px;
        line-height: 1.4;
        color: #c8cad2;
      }
      #dialog-entries li {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      /* The button an entry explains, drawn at 2 screen pixels to an art pixel, a size smaller than
         the button itself. */
      .dialog-entry-icon {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 40px;
        box-sizing: border-box;
        border: 4px solid transparent;
        border-image: var(--button) 2 fill / 4px;
        image-rendering: pixelated;
      }
      .dialog-entry-icon::before {
        content: '';
        width: 24px;
        height: 24px;
        background: var(--entry-icon) center / 100% 100% no-repeat;
        image-rendering: pixelated;
      }
      #dialog-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .dialog-action {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        min-height: 44px;
        padding: 8px 12px;
        font: 22px 'Galmuri11', sans-serif;
        text-align: left;
      }
      .dialog-action span {
        font-size: 18px;
        color: #b8bac2;
      }
      .dialog-action:disabled,
      .dialog-action:disabled span {
        color: #7a7d86;
        cursor: default;
      }
      #equipment-slots {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #3a3c46;
      }
      .inventory-slot.empty-equipment svg {
        opacity: 0.25;
      }
      #inventory-slots {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      /* A slot is a frame 3 art pixels wide on each side. */
      .inventory-slot {
        position: relative;
        aspect-ratio: 1;
        padding: 0;
        border: 6px solid transparent;
        border-image: var(--slot) 3 fill / 6px;
        background: none;
        image-rendering: pixelated;
        cursor: pointer;
        touch-action: manipulation;
      }
      .inventory-slot:disabled {
        filter: brightness(0.8);
        cursor: default;
      }
      /* Every item that is not identified yet looks like this, whatever it is. */
      .inventory-slot.unidentified {
        border-image-source: var(--slot-unknown);
      }
      .inventory-slot.selected {
        border-image-source: var(--slot-selected);
      }
      .inventory-slot svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .inventory-slot span {
        position: absolute;
        right: 4px;
        bottom: 2px;
        font: bold 18px 'Galmuri9', sans-serif;
        color: #fff;
        text-shadow: 0 1px 2px #000;
      }
      #inventory-details {
        min-height: 92px;
        margin-top: 12px;
      }
      #inventory-details p {
        margin: 6px 0 10px;
        color: #c8cad2;
      }
      #inventory-details button {
        min-width: 72px;
        min-height: 40px;
        font: 22px 'Galmuri11', sans-serif;
      }
      #inventory-details button:disabled {
        color: #7a7d86;
        cursor: default;
      }
      #inventory-details p.item-description {
        color: #9a9ca6;
      }
      #inventory-details p.item-stat {
        color: #e8e8ec;
      }
      #inventory-details p.item-stat .enough {
        font-weight: bold;
        color: #7ddc8a;
      }
      #inventory-details p.item-stat .short {
        font-weight: bold;
        color: #ff8f5a;
      }
      #inventory-details .inventory-actions {
        display: flex;
        gap: 8px;
      }
      #target-prompt {
        position: fixed;
        top: 48px;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 6px 6px 14px;
        font: 22px 'Galmuri11', sans-serif;
        color: #e8e8ec;
        border: 8px solid transparent;
        border-image: var(--window) 4 fill / 8px;
        transform: translateX(-50%);
      }
      #target-prompt[hidden] {
        display: none;
      }
      /* A prompt can hold a second line, which tells another way to answer it. */
      #target-prompt-text {
        white-space: pre-line;
      }
      #target-prompt button {
        min-height: 36px;
        padding: 0 12px;
        font: 22px 'Galmuri11', sans-serif;
      }
      #game-over {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgb(0 0 0 / 60%);
        font: 33px 'Galmuri11', sans-serif;
        color: #e8e8ec;
      }
      #game-over[hidden] {
        display: none;
      }
      #game-over-text {
        max-width: 360px;
        margin: 0;
        font: 22px/1.5 'Galmuri11', sans-serif;
        text-align: center;
        color: #c8cad2;
      }
      #run-stats {
        margin: 0;
        padding: 0;
        list-style: none;
        font: 22px/1.6 'Galmuri11', sans-serif;
        text-align: center;
        color: #c8cad2;
      }
      #game-over button {
        padding: 8px 20px;
        font: 22px 'Galmuri11', sans-serif;
      }
      #main-menu {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #14151a;
        color: #e8e8ec;
      }
      #main-menu[hidden] {
        display: none;
      }
      /* The menu fades in over its dark background, which the splash leaves behind it. */
      #main-menu > * {
        transition: opacity 0.8s ease;
      }
      #main-menu.faded > * {
        opacity: 0;
        pointer-events: none;
      }
      #main-menu h1 {
        margin: 0 0 24px;
        font: bold 44px 'Galmuri11', sans-serif;
        letter-spacing: 2px;
      }
      #main-menu button {
        width: 200px;
        padding: 10px 20px;
        font: 22px 'Galmuri11', sans-serif;
      }
      /* Every button wears a pixel frame, 2 art pixels on each side, which uiArt.ts hands over as
         custom properties with the icons. */
      #wait,
      #examine,
      #log-button,
      #inventory-button,
      #settings-button,
      #help-button,
      #inventory-close,
      #log-close,
      #settings-close,
      #dialog-close,
      #main-menu button,
      #game-over button,
      #target-prompt button,
      .dialog-action,
      #inventory-details button {
        color: #e8e8ec;
        border: 4px solid transparent;
        border-image: var(--button) 2 fill / 4px;
        background: none;
        image-rendering: pixelated;
        cursor: pointer;
        touch-action: manipulation;
      }
      :is(#wait, #examine, #log-button, #inventory-button, #settings-button, #help-button,
        #inventory-close, #log-close, #settings-close, #dialog-close, #main-menu button,
        #game-over button, #target-prompt button, .dialog-action,
        #inventory-details button):hover:not(:disabled) {
        border-image-source: var(--button-hover);
      }
      :is(#wait, #examine, #log-button, #inventory-button, #settings-button, #help-button,
        #inventory-close, #log-close, #settings-close, #dialog-close, #main-menu button,
        #game-over button, #target-prompt button, .dialog-action,
        #inventory-details button):active:not(:disabled),
      #examine.active {
        border-image-source: var(--button-pressed);
      }
      .dialog-action:disabled,
      #inventory-details button:disabled {
        cursor: default;
      }
      /* The buttons of the game show 12 by 12 icons instead of words. */
      #wait,
      #examine,
      #log-button,
      #inventory-button,
      #settings-button,
      #help-button,
      #inventory-close,
      #log-close,
      #settings-close,
      #dialog-close {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      /* The buttons on the screen are drawn at 3 screen pixels to an art pixel, frame and icon
         alike, so that they are easy to hit. */
      #wait,
      #examine,
      #log-button,
      #inventory-button,
      #settings-button,
      #help-button {
        border-width: 6px;
        border-image-width: 6px;
      }
      #wait,
      #examine,
      #log-button,
      #inventory-button {
        width: 96px;
        height: 60px;
      }
      #settings-button,
      #help-button {
        width: 60px;
        height: 60px;
      }
      #inventory-close,
      #log-close,
      #settings-close,
      #dialog-close {
        width: 36px;
        height: 36px;
      }
      #wait::before,
      #examine::before,
      #log-button::before,
      #inventory-button::before,
      #settings-button::before,
      #help-button::before,
      #inventory-close::before,
      #log-close::before,
      #settings-close::before,
      #dialog-close::before {
        content: '';
        width: 24px;
        height: 24px;
        background: center / 100% 100% no-repeat;
        image-rendering: pixelated;
      }
      #wait::before,
      #examine::before,
      #log-button::before,
      #inventory-button::before,
      #settings-button::before,
      #help-button::before {
        width: 36px;
        height: 36px;
      }
      #wait::before {
        background-image: var(--icon-wait);
      }
      #examine::before {
        background-image: var(--icon-examine);
      }
      #log-button::before {
        background-image: var(--icon-log);
      }
      #inventory-button::before {
        background-image: var(--icon-bag);
      }
      #inventory-button:hover::before {
        background-image: var(--icon-bag-open);
      }
      #settings-button::before {
        background-image: var(--icon-settings);
      }
      #help-button::before {
        background-image: var(--icon-help);
      }
      #dialog-close.back::before {
        background-image: var(--icon-back);
      }
      #dialog-close.locked {
        cursor: default;
      }
      #dialog-close.locked::before {
        width: 24px;
        height: 24px;
        background-image: var(--timer-icon);
      }
      #inventory-close::before,
      #log-close::before,
      #settings-close::before,
      #dialog-close::before {
        width: 16px;
        height: 16px;
        background-image: var(--icon-close);
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="status"></div>
    <div id="status-tooltip" hidden></div>
    <div id="log" aria-live="polite"></div>
    <div id="top-right">
      <div id="floor"></div>
      <button id="help-button" aria-label="Help" data-i18n-aria="Help" hidden></button>
      <button id="settings-button" aria-label="Settings" data-i18n-aria="Settings" hidden></button>
    </div>
    <div id="bottom-left">
      <button id="wait" aria-label="Wait" data-i18n-aria="Wait" hidden></button>
      <button id="examine" aria-label="Examine" data-i18n-aria="Examine" hidden></button>
      <button id="log-button" aria-label="Log" data-i18n-aria="Log" hidden></button>
    </div>
    <button id="inventory-button" aria-label="Bag" data-i18n-aria="Bag" hidden></button>
    <div id="inventory" hidden>
      <div id="inventory-panel" role="dialog" aria-label="Bag" data-i18n-aria="Bag">
        <div id="inventory-header">
          <span data-i18n="Bag">Bag</span>
          <button id="inventory-close" aria-label="Close" data-i18n-aria="Close"></button>
        </div>
        <div id="equipment-slots"></div>
        <div id="inventory-slots"></div>
        <div id="inventory-details"></div>
      </div>
    </div>
    <div id="main-menu" hidden>
      <h1>ThorVG Dungeon</h1>
      <button id="menu-play" data-i18n="Play">Play</button>
      <button id="menu-settings" data-i18n="Settings">Settings</button>
    </div>
    <div id="log-window" hidden>
      <div id="log-panel" role="dialog" aria-label="Log" data-i18n-aria="Log">
        <div id="log-header">
          <span data-i18n="Log">Log</span>
          <button id="log-close" aria-label="Close" data-i18n-aria="Close"></button>
        </div>
        <div id="log-lines"></div>
      </div>
    </div>
    <div id="settings" hidden>
      <div id="settings-panel" role="dialog" aria-label="Settings" data-i18n-aria="Settings">
        <div id="settings-header">
          <span data-i18n="Settings">Settings</span>
          <button id="settings-close" aria-label="Close" data-i18n-aria="Close"></button>
        </div>
        <label>
          <span data-i18n="Language">Language</span>
          <select id="language"></select>
        </label>
        <label>
          <span data-i18n="UI scale">UI scale</span>
          <select id="ui-scale"></select>
        </label>
        <label>
          <span data-i18n="Sound effects">Sound effects</span>
          <input id="sfx-volume" type="range" min="0" max="100" step="5" />
        </label>
        <label>
          <span data-i18n="Music">Music</span>
          <input id="music-volume" type="range" min="0" max="100" step="5" />
        </label>
        <label>
          <span data-i18n="Mute">Mute</span>
          <button id="mute" aria-pressed="false" aria-label="Mute" data-i18n-aria="Mute"></button>
        </label>
      </div>
    </div>
    <div id="dialog" hidden>
      <div id="dialog-panel" role="dialog" aria-labelledby="dialog-title">
        <div id="dialog-header">
          <span id="dialog-title"></span>
          <button id="dialog-close" aria-label="Close" data-i18n-aria="Close"></button>
        </div>
        <p id="dialog-text"></p>
        <ul id="dialog-entries" hidden></ul>
        <div id="dialog-actions"></div>
      </div>
    </div>
    <div id="target-prompt" hidden>
      <span id="target-prompt-text"></span>
      <button id="target-cancel" data-i18n="Cancel">Cancel</button>
    </div>
    <div id="game-over" hidden>
      <span id="game-over-title">You died</span>
      <p id="game-over-text" hidden></p>
      <ul id="run-stats"></ul>
      <button id="restart">Try again</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
