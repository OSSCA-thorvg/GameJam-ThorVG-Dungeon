<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThorVG Dungeon</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #14151a;
      }
      canvas {
        touch-action: none;
        display: block;
      }
      footer {
        position: fixed;
        right: 8px;
        bottom: 6px;
        font: 11px sans-serif;
        color: #7a7d86;
      }
      footer a {
        color: inherit;
      }
      #floor {
        position: fixed;
        top: 10px;
        left: 12px;
        font: 16px sans-serif;
        color: #c8cad2;
      }
      #wait {
        position: fixed;
        left: 12px;
        bottom: 12px;
        min-width: 72px;
        min-height: 44px;
        font: 16px sans-serif;
        color: #e8e8ec;
        background: #2c2e36;
        border: 1px solid #4a4d58;
        border-radius: 6px;
        cursor: pointer;
        touch-action: manipulation;
      }
      #wait-clock {
        position: absolute;
        inset: 0;
        width: 30px;
        height: 30px;
        margin: auto;
        opacity: 0;
        pointer-events: none;
        fill: none;
        stroke: #e8e8ec;
        stroke-width: 1.6;
        stroke-linecap: round;
      }
      #game-over {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgb(0 0 0 / 60%);
        font: 28px sans-serif;
        color: #e8e8ec;
      }
      #game-over[hidden] {
        display: none;
      }
      #game-over button {
        padding: 8px 20px;
        font: 16px sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="floor"></div>
    <button id="wait" hidden>
      <span id="wait-label">Wait</span>
      <svg id="wait-clock" viewBox="-12 -12 24 24" aria-hidden="true">
        <circle r="10.5" />
        <line id="wait-minute-hand" y2="-8" />
        <line id="wait-hour-hand" y2="-5" />
      </svg>
    </button>
    <div id="game-over" hidden>
      You died
      <button id="restart">Try again</button>
    </div>
    <footer hidden>
      <a href="https://game-icons.net/1x1/cathelineau/swordman.html">Swordman</a> by Cathelineau,
      modified, <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
