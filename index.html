<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThorVG Dungeon</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #14151a;
      }
      canvas {
        touch-action: none;
        display: block;
      }
      /* The UI scale setting enlarges everything but the map, as display scaling enlarges a whole
         screen. A zoomed element also zooms viewport units, so widths from them divide it out. */
      body > :not(canvas) {
        zoom: var(--ui-scale, 1);
      }
      footer {
        position: fixed;
        right: 8px;
        bottom: 6px;
        font: 11px sans-serif;
        color: #7a7d86;
      }
      footer a {
        color: inherit;
      }
      /* Sits on the hero health bar drawn in render.ts. The text at the top left is 17px, where
         the default sans-serif is 18px from its highest ascender to its lowest descender: the
         minimum for PC in Xbox Accessibility Guideline 101. The bar is 4/3 as tall as the text. */
      #hp {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 200px;
        font: bold 17px/23px sans-serif;
        text-align: center;
        color: #fff;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      /* Below the hero health bar. */
      #stats,
      #status {
        position: fixed;
        left: 12px;
        font: 17px sans-serif;
        color: #c8cad2;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #stats {
        top: 41px;
      }
      /* 1.5 lines of text below the stats. */
      #status {
        top: 67px;
        display: flex;
        gap: 8px;
        /* So that hovering an icon shows its name. */
        pointer-events: auto;
      }
      .status-effect {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0;
        font: bold 17px sans-serif;
        color: inherit;
        text-shadow: 0 1px 2px #000;
        background: none;
        border: none;
        cursor: pointer;
      }
      /* Twice as tall as the number beside it. */
      .status-effect svg {
        width: 34px;
        height: 34px;
        padding: 4px;
        border-radius: 50%;
        background: rgb(20 21 26 / 80%);
      }
      #status-tooltip {
        position: fixed;
        max-width: 220px;
        padding: 8px 10px;
        font: 13px/1.4 sans-serif;
        color: #e8e8ec;
        background: #1f2027;
        border: 1px solid #4a4d58;
        border-radius: 6px;
        pointer-events: none;
      }
      #status-tooltip p {
        margin: 4px 0 0;
      }
      .status-effect .line {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .status-effect .fill {
        fill: currentColor;
      }
      /* Above the wait button. */
      #log {
        position: fixed;
        left: 12px;
        bottom: 84px;
        width: min(360px, calc(100vw / var(--ui-scale, 1) - 24px));
        font: 15px/1.4 sans-serif;
        color: #e8e8ec;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #top-right {
        position: fixed;
        top: 6px;
        right: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #floor {
        font: 16px sans-serif;
        color: #c8cad2;
      }
      #settings-button {
        width: 36px;
        height: 36px;
        padding: 6px;
        color: #c8cad2;
        background: #2c2e36;
        border: 1px solid #4a4d58;
        border-radius: 6px;
        cursor: pointer;
        touch-action: manipulation;
      }
      #settings-button svg {
        display: block;
        width: 100%;
        height: 100%;
        fill: currentColor;
      }
      #bottom-left {
        position: fixed;
        left: 12px;
        bottom: 28px;
        display: flex;
        gap: 8px;
      }
      #wait {
        position: relative;
      }
      #inventory-button {
        position: fixed;
        right: 12px;
        bottom: 28px;
      }
      #wait,
      #examine,
      #log-button,
      #inventory-button {
        min-width: 72px;
        min-height: 44px;
        font: 16px sans-serif;
        color: #e8e8ec;
        background: #2c2e36;
        border: 1px solid #4a4d58;
        border-radius: 6px;
        cursor: pointer;
        touch-action: manipulation;
      }
      #wait-clock {
        position: absolute;
        inset: 0;
        width: 30px;
        height: 30px;
        margin: auto;
        opacity: 0;
        pointer-events: none;
        fill: none;
        stroke: #e8e8ec;
        stroke-width: 1.6;
        stroke-linecap: round;
      }
      #inventory,
      #log-window,
      #settings,
      #dialog {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(0 0 0 / 50%);
      }
      #inventory[hidden],
      #log-window[hidden],
      #settings[hidden],
      #dialog[hidden] {
        display: none;
      }
      #inventory-panel,
      #log-panel,
      #settings-panel,
      #dialog-panel {
        width: min(340px, calc(100vw / var(--ui-scale, 1) - 24px));
        box-sizing: border-box;
        padding: 12px;
        font: 14px sans-serif;
        color: #e8e8ec;
        background: #1f2027;
        border: 1px solid #4a4d58;
        border-radius: 8px;
      }
      #inventory-header,
      #log-header,
      #settings-header,
      #dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 16px;
      }
      #inventory-close,
      #log-close,
      #settings-close,
      #dialog-close {
        width: 36px;
        height: 36px;
        font-size: 20px;
        color: inherit;
        background: none;
        border: none;
        cursor: pointer;
      }
      #log-lines {
        height: 60vh;
        overflow-y: scroll;
        font-size: 15px;
        line-height: 1.5;
      }
      #log-lines div {
        padding: 2px 0;
      }
      #settings-panel label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 40px;
      }
      #settings-panel select {
        min-height: 36px;
        padding: 0 8px;
        font: 14px sans-serif;
        color: #e8e8ec;
        background: #3a3d48;
        border: 1px solid #5a5d68;
        border-radius: 6px;
      }
      #dialog-panel p {
        margin: 0 0 10px;
        line-height: 1.5;
        color: #c8cad2;
      }
      #dialog-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .dialog-action {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        min-height: 44px;
        padding: 8px 12px;
        font: 14px sans-serif;
        text-align: left;
        color: #e8e8ec;
        background: #3a3d48;
        border: 1px solid #5a5d68;
        border-radius: 6px;
        cursor: pointer;
      }
      .dialog-action span {
        font-size: 13px;
        color: #b8bac2;
      }
      .dialog-action:disabled,
      .dialog-action:disabled span {
        color: #7a7d86;
        cursor: default;
      }
      #equipment-slots {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #3a3c46;
      }
      .inventory-slot.empty-equipment svg {
        opacity: 0.25;
      }
      #inventory-slots {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .inventory-slot {
        position: relative;
        aspect-ratio: 1;
        padding: 6px;
        background: #2c2e36;
        border: 1px solid #3a3c46;
        border-radius: 6px;
        cursor: pointer;
        touch-action: manipulation;
      }
      .inventory-slot:disabled {
        background: #25262d;
        cursor: default;
      }
      /* Every item that is not identified yet looks like this, whatever it is. */
      .inventory-slot.unidentified {
        background: #3a3352;
        border-color: #54497a;
      }
      .inventory-slot.selected {
        border-color: #f5cd46;
      }
      .inventory-slot svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .inventory-slot span {
        position: absolute;
        right: 4px;
        bottom: 2px;
        font: bold 12px sans-serif;
        color: #fff;
        text-shadow: 0 1px 2px #000;
      }
      #inventory-details {
        min-height: 92px;
        margin-top: 12px;
      }
      #inventory-details p {
        margin: 6px 0 10px;
        color: #c8cad2;
      }
      #inventory-details button {
        min-width: 72px;
        min-height: 40px;
        font: 14px sans-serif;
        color: #e8e8ec;
        background: #3a3d48;
        border: 1px solid #5a5d68;
        border-radius: 6px;
        cursor: pointer;
      }
      #inventory-details button:disabled {
        color: #7a7d86;
        cursor: default;
      }
      #inventory-details p.item-description {
        color: #9a9ca6;
      }
      #inventory-details p.item-stat {
        color: #e8e8ec;
      }
      #inventory-details p.item-stat .enough {
        font-weight: bold;
        color: #7ddc8a;
      }
      #inventory-details p.item-stat .short {
        font-weight: bold;
        color: #ff8f5a;
      }
      #inventory-details .inventory-actions {
        display: flex;
        gap: 8px;
      }
      #target-prompt {
        position: fixed;
        top: 48px;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 6px 6px 14px;
        font: 15px sans-serif;
        color: #e8e8ec;
        background: #1f2027;
        border: 1px solid #5a8fd0;
        border-radius: 6px;
        transform: translateX(-50%);
      }
      #target-prompt[hidden] {
        display: none;
      }
      #target-prompt button {
        min-height: 36px;
        padding: 0 12px;
        font: 14px sans-serif;
        color: #e8e8ec;
        background: #3a3d48;
        border: 1px solid #5a5d68;
        border-radius: 6px;
        cursor: pointer;
      }
      #game-over {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgb(0 0 0 / 60%);
        font: 28px sans-serif;
        color: #e8e8ec;
      }
      #game-over[hidden] {
        display: none;
      }
      #game-over-text {
        max-width: 360px;
        margin: 0;
        font: 16px/1.5 sans-serif;
        text-align: center;
        color: #c8cad2;
      }
      #run-stats {
        margin: 0;
        padding: 0;
        list-style: none;
        font: 16px/1.6 sans-serif;
        text-align: center;
        color: #c8cad2;
      }
      #game-over button {
        padding: 8px 20px;
        font: 16px sans-serif;
        cursor: pointer;
      }
      #main-menu {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #14151a;
        color: #e8e8ec;
      }
      #main-menu[hidden] {
        display: none;
      }
      /* The menu fades in over its dark background, which the splash leaves behind it. */
      #main-menu > * {
        transition: opacity 0.8s ease;
      }
      #main-menu.faded > * {
        opacity: 0;
        pointer-events: none;
      }
      #main-menu h1 {
        margin: 0 0 24px;
        font: bold 44px sans-serif;
        letter-spacing: 2px;
      }
      #main-menu button {
        width: 200px;
        padding: 10px 20px;
        font: 18px sans-serif;
        color: #e8e8ec;
        background: #2c2e36;
        border: 1px solid #4a4d58;
        border-radius: 6px;
        cursor: pointer;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hp"></div>
    <div id="stats"></div>
    <div id="status"></div>
    <div id="status-tooltip" hidden></div>
    <div id="log" aria-live="polite"></div>
    <div id="top-right">
      <div id="floor"></div>
      <button id="settings-button" aria-label="Settings" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M10.071 4.236L10.276 1.642L13.724 1.642L13.929 4.236L16.126 5.146L18.105 3.457L20.543 5.895L18.854 7.874L19.764 10.071L22.358 10.276L22.358 13.724L19.764 13.929L18.854 16.126L20.543 18.105L18.105 20.543L16.126 18.854L13.929 19.764L13.724 22.358L10.276 22.358L10.071 19.764L7.874 18.854L5.895 20.543L3.457 18.105L5.146 16.126L4.236 13.929L1.642 13.724L1.642 10.276L4.236 10.071L5.146 7.874L3.457 5.895L5.895 3.457L7.874 5.146ZM15.500 12A3.500 3.500 0 1 0 8.500 12A3.500 3.500 0 1 0 15.500 12Z"
          />
        </svg>
      </button>
    </div>
    <div id="bottom-left">
      <button id="wait" hidden>
        <span id="wait-label">Wait</span>
        <svg id="wait-clock" viewBox="-12 -12 24 24" aria-hidden="true">
          <circle r="10.5" />
          <line id="wait-minute-hand" y2="-8" />
          <line id="wait-hour-hand" y2="-5" />
        </svg>
      </button>
      <button id="examine" hidden>Examine</button>
      <button id="log-button" hidden>Log</button>
    </div>
    <button id="inventory-button" hidden>Bag</button>
    <div id="inventory" hidden>
      <div id="inventory-panel" role="dialog" aria-label="Bag">
        <div id="inventory-header">
          Bag
          <button id="inventory-close" aria-label="Close">×</button>
        </div>
        <div id="equipment-slots"></div>
        <div id="inventory-slots"></div>
        <div id="inventory-details"></div>
      </div>
    </div>
    <div id="main-menu" hidden>
      <h1>ThorVG Dungeon</h1>
      <button id="menu-play">Play</button>
      <button id="menu-settings">Settings</button>
    </div>
    <div id="log-window" hidden>
      <div id="log-panel" role="dialog" aria-label="Log">
        <div id="log-header">
          Log
          <button id="log-close" aria-label="Close">×</button>
        </div>
        <div id="log-lines"></div>
      </div>
    </div>
    <div id="settings" hidden>
      <div id="settings-panel" role="dialog" aria-label="Settings">
        <div id="settings-header">
          Settings
          <button id="settings-close" aria-label="Close">×</button>
        </div>
        <label>
          UI scale
          <select id="ui-scale"></select>
        </label>
        <label>
          Sound effects
          <input id="sfx-volume" type="range" min="0" max="100" step="5" />
        </label>
        <label>
          Music
          <input id="music-volume" type="range" min="0" max="100" step="5" />
        </label>
      </div>
    </div>
    <div id="dialog" hidden>
      <div id="dialog-panel" role="dialog" aria-labelledby="dialog-title">
        <div id="dialog-header">
          <span id="dialog-title"></span>
          <button id="dialog-close" aria-label="Close">×</button>
        </div>
        <p id="dialog-text"></p>
        <div id="dialog-actions"></div>
      </div>
    </div>
    <div id="target-prompt" hidden>
      <span id="target-prompt-text"></span>
      <button id="target-cancel">Cancel</button>
    </div>
    <div id="game-over" hidden>
      <span id="game-over-title">You died</span>
      <p id="game-over-text" hidden></p>
      <ul id="run-stats"></ul>
      <button id="restart">Try again</button>
    </div>
    <footer hidden>
      <a href="https://game-icons.net/1x1/cathelineau/swordman.html">Swordman</a> by Cathelineau,
      modified, <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
